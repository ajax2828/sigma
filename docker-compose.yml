services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    image: sigma
    container_name: sigma
    restart: unless-stopped
    ports:
      - "8000:8000"
      - "8090:8090"
    volumes:
      - ./docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini:ro
      - ./docker/entrypoint.sh:/usr/local/bin/entrypoint.sh:ro
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./resources:/var/www/resources
      - ./routes:/var/www/routes
      - ./app:/var/www/app
      - ./database/seeders:/var/www/database/seeders
      - ./database/migrations:/var/www/database/migrations
      - ./database/database.sqlite:/var/www/database/database.sqlite
      - ./public/images:/var/www/public/images
      - ./public/landing.html:/var/www/public/landing.html:ro
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
      - DB_CONNECTION=sqlite
      - DB_DATABASE=/var/www/database/database.sqlite
      - CACHE_DRIVER=file
      - SESSION_DRIVER=file
      - QUEUE_CONNECTION=sync
    healthcheck:
      test: ["CMD", "php", "-r", "exit(extension_loaded('pdo_sqlite') ? 0 : 1);"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
