name: spm

services:
  # ── PHP-FPM (Laravel) ──
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: app
    container_name: spm-app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Override yg wajib untuk docker (jika .env masih sqlite, ini akan override)
      DB_CONNECTION: ${DB_CONNECTION:-mysql}
      DB_HOST: ${DB_HOST:-db}
      DB_PORT: ${DB_PORT:-3306}
      DB_DATABASE: ${DB_DATABASE:-spm}
      DB_USERNAME: ${DB_USERNAME:-spm}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
      CACHE_STORE: ${CACHE_STORE:-database}
      QUEUE_CONNECTION: ${QUEUE_CONNECTION:-database}
      SESSION_DRIVER: ${SESSION_DRIVER:-database}
      MAIL_MAILER: ${MAIL_MAILER:-smtp}
      MAIL_HOST: ${MAIL_HOST:-mailpit}
      MAIL_PORT: ${MAIL_PORT:-1025}
    volumes:
      - ./:/var/www
      # anonymous volumes agar vendor & build tidak ketimpa bind mount host
      - /var/www/vendor
      - /var/www/public/build
      - storage_data:/var/www/storage
      - ./docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini:ro
    depends_on:
      db:
        condition: service_healthy
    networks:
      - spm
    healthcheck:
      test: ["CMD-SHELL", "php artisan inspire || exit 0"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── Nginx ──
  nginx:
    image: nginx:1.27-alpine
    container_name: spm-nginx
    restart: unless-stopped
    ports:
      - "${NGINX_PORT:-8000}:80"
    volumes:
      - ./:/var/www:ro
      - ./public:/var/www/public:ro
      - storage_data:/var/www/storage
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_started
    networks:
      - spm

  # ── MySQL 8.0 ──
  db:
    image: mysql:8.0
    container_name: spm-db
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-spm}
      MYSQL_USER: ${DB_USERNAME:-spm}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootsecret}
    ports:
      - "${DB_PORT_HOST:-3307}:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "${DB_USERNAME:-spm}", "-p${DB_PASSWORD:-secret}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - spm

  # ── Queue Worker (database) ── wajib untuk import Excel & email ──
  queue:
    build:
      context: .
      dockerfile: Dockerfile
      target: app
    container_name: spm-queue
    restart: unless-stopped
    command: php artisan queue:work --sleep=3 --tries=3 --max-time=3600 --queue=default
    env_file:
      - .env
    environment:
      DB_CONNECTION: ${DB_CONNECTION:-mysql}
      DB_HOST: ${DB_HOST:-db}
      DB_PORT: ${DB_PORT:-3306}
      DB_DATABASE: ${DB_DATABASE:-spm}
      DB_USERNAME: ${DB_USERNAME:-spm}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
      QUEUE_CONNECTION: ${QUEUE_CONNECTION:-database}
      MAIL_MAILER: ${MAIL_MAILER:-smtp}
      MAIL_HOST: ${MAIL_HOST:-mailpit}
      MAIL_PORT: ${MAIL_PORT:-1025}
    volumes:
      - ./:/var/www
      - /var/www/vendor
      - /var/www/public/build
      - storage_data:/var/www/storage
    depends_on:
      app:
        condition: service_started
      db:
        condition: service_healthy
    networks:
      - spm

  # ── Mailpit (tangkap email, UI di 8025) ──
  mailpit:
    image: axllent/mailpit:v1.21
    container_name: spm-mailpit
    restart: unless-stopped
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_UI_PORT:-8025}:8025"
    networks:
      - spm

  # ── Vite dev server (opsional, hanya untuk HMR) ──
  # Jalankan: docker compose --profile dev up
  vite:
    image: node:20-alpine
    container_name: spm-vite
    working_dir: /var/www
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    ports:
      - "${VITE_PORT:-5173}:5173"
    volumes:
      - ./:/var/www
      - /var/www/node_modules
    profiles:
      - dev
    networks:
      - spm

volumes:
  db_data:
    driver: local
  storage_data:
    driver: local

networks:
  spm:
    driver: bridge
